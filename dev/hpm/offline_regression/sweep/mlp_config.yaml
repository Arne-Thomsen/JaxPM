method: random
metric:
  name: validation_loss
  goal: minimize
parameters:
  # data
  x_labels:
    values:
      - ["scale", "rho"]
      - ["scale", "rho", "fscalar"]
  y_labels:
    values: ["P"]
  # network
  d_hidden:
    values: [32, 64, 128, 256, 512]
  n_hidden:
    distribution: int_uniform
    min: 1
    max: 8
  dropout_rate:
    distribution: uniform
    min: 0.0
    max: 0.5
  activation:
    values: [relu, swish, sigmoid]
  norm_type:
    values: ["layer", "batch", "none"]
  # optimizer
  n_steps:
    values: [1_000]
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2
